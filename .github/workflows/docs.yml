name: Docs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build DocC archives (plugin-free — keeps the package zero-dependency)
        run: |
          set -euo pipefail
          PRODUCTS="PalCore PalPersistence PalNetworking PalAuth PalPresentation PalNavigation PalDesignSystem PalAnalytics PalFeatureFlags PalDebugKit PalNotifications PalWeb"
          mkdir -p site
          for PRODUCT in $PRODUCTS; do
            echo "::group::docbuild $PRODUCT"
            xcodebuild docbuild -scheme "$PRODUCT" \
              -destination 'generic/platform=iOS' \
              -derivedDataPath .docc-build -quiet
            LOWER=$(echo "$PRODUCT" | tr '[:upper:]' '[:lower:]')
            "$(xcrun --find docc)" process-archive transform-for-static-hosting \
              ".docc-build/Build/Products/Debug-iphoneos/$PRODUCT.doccarchive" \
              --output-path "site/$LOWER" \
              --hosting-base-path "pal-mvvm-foundation/$LOWER"
            echo "::endgroup::"
          done
      - name: Generate the landing index
        run: |
          set -euo pipefail
          PRODUCTS="PalCore PalPersistence PalNetworking PalAuth PalPresentation PalNavigation PalDesignSystem PalAnalytics PalFeatureFlags PalDebugKit PalNotifications PalWeb"
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Pal — API Documentation</title>'
            echo '<style>body{font:17px -apple-system,system-ui;max-width:640px;margin:48px auto;padding:0 24px;color:#1d1d1f}h1{font-size:34px}li{margin:6px 0}a{color:#06c;text-decoration:none}a:hover{text-decoration:underline}p{color:#6e6e73}</style>'
            echo '</head><body><h1>Pal — API Documentation</h1>'
            echo '<p>Symbol-level reference for every product, generated with DocC. Usage guides live in the <a href="https://github.com/Mesrine23/pal-mvvm-foundation">repository</a>.</p><ul>'
            for PRODUCT in $PRODUCTS; do
              LOWER=$(echo "$PRODUCT" | tr '[:upper:]' '[:lower:]')
              echo "<li><a href=\"$LOWER/documentation/$LOWER/\">$PRODUCT</a></li>"
            done
            echo '</ul></body></html>'
          } > site/index.html
          REPO_DOCS=https://github.com/Mesrine23/pal-mvvm-foundation/blob/main
          {
            echo '# Pal'
            echo
            echo '> A reusable, zero-dependency iOS foundation: one Swift Package, twelve library products, consumed by apps via SPM. Swift 6 strict concurrency, iOS 17+, MVVM + Coordinators, Clean layering. The foundation ships mechanisms; apps ship values — endpoints, strings, brand tokens, storage keys and environments are supplied by the app.'
            echo
            echo '## Start here'
            echo
            echo "- [Adopter brief]($REPO_DOCS/Documentation/ADOPTERS.md): the conventions an agent needs to build an app on Pal — mechanisms vs values, the Loader/ViewState screen shape, app-layer naming, and the gotchas that cost the most time."
            echo "- [Getting Started]($REPO_DOCS/Documentation/GettingStarted.md): install, the app shell, the composition root, and the first feature end to end."
            echo "- [Architecture]($REPO_DOCS/Documentation/ARCHITECTURE.md): layers, the product dependency DAG, patterns, adoption notes."
            echo "- [Changelog]($REPO_DOCS/CHANGELOG.md): per-release changes; every entry opens with the products it affects."
            echo
            echo '## Product guides'
            echo
            for PRODUCT in $PRODUCTS; do
              echo "- [$PRODUCT]($REPO_DOCS/Documentation/Products/$PRODUCT.md): usage guide."
            done
            echo
            echo '## API reference'
            echo
            for PRODUCT in $PRODUCTS; do
              LOWER=$(echo "$PRODUCT" | tr '[:upper:]' '[:lower:]')
              echo "- [$PRODUCT symbols](https://mesrine23.github.io/pal-mvvm-foundation/$LOWER/documentation/$LOWER/): generated DocC reference."
            done
          } > site/llms.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
